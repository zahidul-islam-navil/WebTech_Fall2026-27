<!--
Scenario: Patient Registration Form

Write a form that requires:
- A patient name of at least 6 characters.
- An age between 1 and 100.
- One selected gender.
- At least one selected department.

-->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patient Registration</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: aliceblue;
            max-width: 720px;
            margin: 0 auto;
            padding: 70px 20px;
        }

        .header {
            background-color: black;
            color: white;
            text-align: center;
            padding: 5px;
            margin-bottom: 20px;
            border-radius: 20px;
        }

        fieldset {
            background-color: white;
            border: 2px solid black;
            border-radius: 20px;
            padding: 20px;
        }

        legend {
            background-color: bisque;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 8px 6px;
            vertical-align: top;
        }

        input[type="text"],
        input[type="number"] {
            width: 90%;
            padding: 8px 10px;
            font-family: Cambria, Georgia, serif;
            font-size: 16px;
            border: 1px solid black;
            border-radius: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin: 10px 4px 0 10px;
        }

        p {
            color: red;
            font-size: 13px;
            font-weight: bold;
        }

        .btn {
            background-color: black;
            color: white;
            padding: 10px 28px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: skyblue;
            color: black;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Patient Registration Form</h1>
    </div>

    <form novalidate onsubmit="return validateForm()" onreset="clearAllErrors()">

        <fieldset>
            <legend>Patient Personal Information</legend>

            <table>
                <tr>
                    <td>
                        <label for="PatientName">Patient Name:</label>
                    </td>
                    <td>
                        <input type="text" id="PatientName" name="PatientName">
                        <p id="NameError"></p>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="PatientAge">Patient Age:</label>
                    </td>
                    <td>
                        <input type="number" id="PatientAge" name="PatientAge">
                        <p id="AgeError"></p>
                    </td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" id="Male" name="gender" value="Male">
                        <label for="Male">Male</label>

                        <input type="radio" id="Female" name="gender" value="Female">
                        <label for="Female">Female</label>

                        <p id="ErrorGender"></p>
                    </td>
                </tr>

                <tr>
                    <td>Doctor Department:</td>
                    <td>
                        <input type="checkbox" id="DeptMedicine" name="dept" value="Medicine">
                        <label for="DeptMedicine">Medicine</label>

                        <input type="checkbox" id="DeptCardiac" name="dept" value="Cardiac">
                        <label for="DeptCardiac">Cardiac</label>

                        <input type="checkbox" id="DeptNeurology" name="dept" value="Neurology">
                        <label for="DeptNeurology">Neurology</label>

                        <p id="DeptError"></p>
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" id="submit" value="Signup" class="btn">
                        <input type="reset" id="reset" value="Reset" class="btn">
                    </td>
                </tr>
            </table>
        </fieldset>

    </form>

    <script>
        function validateForm() {
            clearAllErrors();

            // Run all four checks so all errors can appear on the same attempt.
            let nameIsValid = validateName();
            let ageIsValid = validateAge();
            let genderIsValid = validateGender();
            let departmentIsValid = validateDepartment();

            if (nameIsValid && ageIsValid && genderIsValid && departmentIsValid) {
                alert("Registration Successful");
                return true; // Allow the normal form submission.
            }

            return false; // Stop submission when any check fails.
        }

        function validateName() {
            let patientName = document.getElementById("PatientName").value.trim();
            let nameError = document.getElementById("NameError");
            nameError.style.color = "red";

            if (patientName === "") {
                nameError.textContent = "Please enter the patient's name.";
                return false;
            }

            if (patientName.length < 6) {
                nameError.textContent = "Name must be at least 6 characters.";
                return false;
            }

            return true;
        }

        function validateAge() {
            let ageText = document.getElementById("PatientAge").value;
            let ageError = document.getElementById("AgeError");
            ageError.style.color = "red";

            // Check the empty field before converting it to a number.
            if (ageText === "") {
                ageError.textContent = "Please enter the patient's age.";
                return false;
            }

            let age = Number(ageText);

            if (!Number.isInteger(age) || age < 1 || age > 100) {
                ageError.textContent = "Age must be a whole number from 1 to 100.";
                return false;
            }

            return true;
        }

        function validateGender() {
            let genders = document.getElementsByName("gender");

            // The shared name lets us check both radio buttons as a group.
            for (let i = 0; i < genders.length; i++) {
                if (genders[i].checked) {
                    return true;
                }
            }

            let genderError = document.getElementById("ErrorGender");
            genderError.style.color = "red";
            genderError.textContent = "Please select a gender.";
            return false;
        }

        function validateDepartment() {
            let departments = document.getElementsByName("dept");

            // One checked department is enough to pass this rule.
            for (let i = 0; i < departments.length; i++) {
                if (departments[i].checked) {
                    return true;
                }
            }

            let deptError = document.getElementById("DeptError");
            deptError.style.color = "red";
            deptError.textContent = "Please select at least one department.";
            return false;
        }

        function clearAllErrors() {
            document.getElementById("NameError").textContent = "";
            document.getElementById("AgeError").textContent = "";
            document.getElementById("ErrorGender").textContent = "";
            document.getElementById("DeptError").textContent = "";
        }
    </script>

</body>

</html>
